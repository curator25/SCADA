server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Never cache - SCADA/browser must always fetch the latest build.
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
    add_header Pragma "no-cache" always;
    expires -1;

    # Forward API calls to the Python backend container.
    #
    # The upstream is held in a variable and resolved through Docker's internal
    # DNS at request time. That way nginx still starts even if the backend
    # container is not up yet, instead of failing with "host not found".
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $kpi_backend backend:8000;

        proxy_pass http://$kpi_backend$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 5s;
        proxy_read_timeout    30s;
    }

    # Single-page app: fall back to index.html for unknown routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
